<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 25px;
            }
            #box, #boxTwo{
                width: 50px;
                height: 50px;
                background-color: #7f7f7f;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            #apple{
                width: 150px;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://t4.ftcdn.net/jpg/00/59/96/75/360_F_59967553_9g2bvhTZf18zCmEVWcKigEoevGzFqXzq.jpg" alt="apple" id="apple" onmouseout="changeImage()">
        <div id="box-wrapper">
            <div id="box" onmouseover="dissapear()" onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="boxTwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>    
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>    
            </div>
        </div>
        <input type="color" id="colorPicker">
        <button onClick="color()">Click Me</button>
        <br>
        <button id="showMore" onclick="show()">Show More</button>
        <script>
            let images = ["https://media.istockphoto.com/id/2184346751/photo/gala-apple-composition-on-wooden-table.jpg?s=612x612&w=0&k=20&c=3IOuFp833fvq5B283Rhf2pNw7hJUc45SlLMwTN5oBt0=", "https://t3.ftcdn.net/jpg/01/92/55/78/360_F_192557838_VdAYRdjHxX56QjqBlgo6nOEC1VWTDKOZ.jpg", "https://media.istockphoto.com/id/187420397/photo/red-apples.jpg?s=612x612&w=0&k=20&c=2gP5VblBy8wBB1aMuB9godHm_QYuKOdvb1U_f9h4Kjk=", "https://t4.ftcdn.net/jpg/00/59/96/75/360_F_59967553_9g2bvhTZf18zCmEVWcKigEoevGzFqXzq.jpg"]
            let current = 0
            function changeImage(){
                current += 1
                if (current > 3){
                    current = 0
                }
                document.getElementById("apple").src = images[current]
            }
            function color(){
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor = newColor
            }
            function dissapear(){
                document.getElementById("boxTwo").style.display = 'none'
            }
            function appear(){
                document.getElementById("boxTwo").style.display = 'block'
            }
            function show(){
                let element = document.getElementById("flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show More"
                }else{
                    element.style.display = "flex"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
