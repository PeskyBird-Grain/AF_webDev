<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Advanced HTML Notes</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <ol type="i">
            <li>This is the first thing</li>
            <li>This is the second</li>
            <li>This is third</li>
        </ol>
        <ul>
            <li><a href="https://commons.wikimedia.org/wiki/File:Honeycrisp-Apple.jpg" target="_blank">Apple</a></li>
            <li>Bannana</li>
            <li>Kiwi</li>
        </ul>
        <dl>
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>Hanukkah</dd>
            <dd>New Years</dd>
        </dl>
        <h3>Attributes:</h3>
        <img src="https://globalsummitguide.com/wp-content/uploads/2026/07/AdobeStock_1146206325-scaled.jpeg" alt="Mount Timp" width="200px">
        <div>
        <img src="mt_timp.jpg" alt="Snowy Timp" width="200px">
        <p>Image from <a href="https://www.flickr.com/photos/stripeyanne/422744753" target="_blank">Flickr</a></p>
        </div>
    </body>
</html>
