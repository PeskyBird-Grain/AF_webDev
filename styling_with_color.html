<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Styling With Color</title>
        <meta charset="UTF-8">
        <style>
            body{
                background-color: #7f7f7f;
            }
            #header{
                text-align:right;
                background-color: #fff;
                border-radius: 5px;
                width: 260px;
            }
            #complementary{
                text-align: center;
                background-color: #ffff00;
                border: solid 10px #800080;
                width: 150px;
                height: 150px;
            }
            #analogous{
            text-align: center;
            color: #0ff;
            background-color: #00f;
            border: solid 10px #0f0;
            width: 150px;
            height: 150px;
            }
            #triadic{
            text-align: center;
            color: #800080;
            background-color: #0f0;
            border: solid 10px #ffa500;
            width: 150px;
            height: 150px;
            }
        </style>
    </head>
    <body>
        <h1 id="header">Styling With Color</h1>
        <div id="complementary">
            <h3>Complementary</h3>
        </div>
        <div id="analogous">
            <h3>Analogous</h3>
        </div>
        <div id="triadic">
            <h3>Triadic</h3>
        </div>
    </body>
</html>
